<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monada Store | Timeless Apparel &amp; Aesthetics</title>

    <!-- Search and social sharing. Without these, a shared link shows no
         preview image or description, which matters for a catalog shared
         through WhatsApp and Instagram. -->
    <meta
      name="description"
      content="Monada Store — curated apparel with minimalist aesthetics and contemporary tailoring. Shop the catalog and order directly on WhatsApp. Envíos a toda Venezuela."
    />
    <meta name="theme-color" content="#758A77" />
    <link rel="canonical" href="https://monadastore.com/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monada Store" />
    <meta property="og:title" content="Monada Store | Timeless Apparel &amp; Aesthetics" />
    <meta
      property="og:description"
      content="Curated apparel with minimalist aesthetics and contemporary tailoring. Order directly on WhatsApp. Envíos a toda Venezuela."
    />
    <meta property="og:image" content="/logo-transparent.png" />
    <meta property="og:image:alt" content="Monada Store" />
    <meta property="og:url" content="https://monadastore.com/" />
    <meta property="og:locale" content="es_VE" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monada Store | Timeless Apparel &amp; Aesthetics" />
    <meta
      name="twitter:description"
      content="Curated apparel with minimalist aesthetics and contemporary tailoring. Order directly on WhatsApp."
    />
    <meta name="twitter:image" content="/logo-transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
